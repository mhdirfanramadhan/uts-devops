services:
  client:
    image: ${DOCKERHUB_USERNAME}/mern-ecommerce-client:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - app-network
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  server:
    image: ${DOCKERHUB_USERNAME}/mern-ecommerce-server:latest
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/mern_ecommerce
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: http://localhost:8080
    command: ["sh", "-c", "npm run seed:db ${ADMIN_EMAIL} ${ADMIN_PASSWORD} && npm start"]
    depends_on:
      - mongo
    networks:
      - app-network
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 5 --cleanup --label-enable
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
